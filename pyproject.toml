[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelbras-info"
version = "0.1.0"
description = "Ferramenta GUI e CLI para consulta e gerenciamento de interfones Intelbras via API HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Felipe Marta Batista" }]
keywords = ["intelbras", "intercom", "sip", "cli", "gui", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = [
    "black>=26.0",
    "pyinstaller>=6.0",
]

[project.scripts]
intelbras-info = "cli_controller:run"

[project.gui-scripts]
intelbras-info-gui = "gui_app:main"

[project.urls]
Repository = "https://github.com/felipemartab/intelbras-info"

[tool.setuptools]
py-modules = [
    "cli_app",
    "cli_controller",
    "gui_app",
    "gui_controller",
    "gui_view",
    "model",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
